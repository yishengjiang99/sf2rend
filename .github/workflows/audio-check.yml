# Live-site audio check: loads the deployed Pages site, clicks play, and
# verifies the AudioContext destination carries a non-silent signal.
#
# Runs after every successful Pages deploy, on a 6-hour schedule, and on
# manual dispatch. All actions are pinned by full SHA (see build-deploy.yml).

name: audio-check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  workflow_run:
    workflows: ["build-deploy"]
    types: [completed]

jobs:
  check:
    # Only run after a successful deploy (not on failed/cancelled runs).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: setup-chrome

      - name: Audio output check on the live site
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node tools/audio-check.mjs --url https://yishengjiang99.github.io/sf2rend/
